<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('학과 관리')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
	<div class="page-head">
		<div>
			<h1>학과 관리</h1>
			<p class="muted">총 <strong th:text="${#lists.size(departments)}">0</strong>개 학과</p>
		</div>
	</div>
	<div th:replace="~{fragments/layout :: alerts}"></div>

	<div class="card">
		<form th:action="@{/departments}" method="post" class="toolbar">
			<input type="text" name="code" placeholder="학과 코드 (예: CS)" maxlength="20" required class="w-sm">
			<input type="text" name="name" placeholder="학과 이름 (예: 컴퓨터공학과)" maxlength="20" required>
			<button type="submit" class="btn btn-primary">+ 추가</button>
		</form>

		<div class="table-wrap">
			<table class="table">
				<thead><tr><th>학과 코드</th><th>학과 이름</th><th>생성일</th></tr></thead>
				<tbody>
				<tr th:each="d : ${departments}">
					<td class="mono" th:text="${d.code}"></td>
					<td th:text="${d.name}"></td>
					<td class="muted" th:text="${#temporals.format(d.regDate, 'yyyy. M. d.')}"></td>
				</tr>
				<tr th:if="${#lists.isEmpty(departments)}">
					<td colspan="3" class="empty">등록된 학과가 없습니다. 위에서 학과를 추가하세요.</td>
				</tr>
				</tbody>
			</table>
		</div>
	</div>
</main>
</body>
</html>
