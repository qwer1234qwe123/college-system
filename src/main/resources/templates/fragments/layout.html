<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${title} + ' | 학사정보시스템'">학사정보시스템</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:fragment="header" class="header">
	<div class="header-inner">
		<a class="brand" th:href="@{/}">
			<span class="brand-mark">학</span>
			<span class="brand-name">학사정보시스템</span>
		</a>
		<nav class="nav" sec:authorize="isAuthenticated()">
			<a th:href="@{/}" th:classappend="${currentPath == '/'} ? 'active'">홈</a>
			<a sec:authorize="hasRole('PROF')" th:href="@{/students}"
			   th:classappend="${#strings.startsWith(currentPath, '/students')} ? 'active'">학생 관리</a>
			<a sec:authorize="hasRole('PROF')" th:href="@{/departments}"
			   th:classappend="${#strings.startsWith(currentPath, '/departments')} ? 'active'">학과 관리</a>
			<a sec:authorize="hasRole('PROF')" th:href="@{/subjects}"
			   th:classappend="${#strings.startsWith(currentPath, '/subjects')} ? 'active'">과목 관리</a>
			<a sec:authorize="hasRole('PROF')" th:href="@{/lectures}"
			   th:classappend="${#strings.startsWith(currentPath, '/lectures')} ? 'active'">성적 입력</a>
			<a sec:authorize="hasRole('STUDENT')" th:href="@{/enroll}"
			   th:classappend="${#strings.startsWith(currentPath, '/enroll')} ? 'active'">수강신청</a>
			<a th:href="@{/timetable}"
			   th:classappend="${currentPath == '/timetable'} ? 'active'">시간표</a>
			<a sec:authorize="hasRole('STUDENT')" th:href="@{/my/grades}"
			   th:classappend="${currentPath == '/my/grades'} ? 'active'">내 성적</a>
			<a sec:authorize="hasRole('STUDENT')" th:href="@{/me}"
			   th:classappend="${currentPath == '/me'} ? 'active'">내 정보</a>
		</nav>
		<div class="user-box" sec:authorize="isAuthenticated()">
			<span class="avatar" th:text="${#strings.substring(currentUserName, 0, 1)}">관</span>
			<span class="user-meta">
				<strong th:text="${currentUserName}">이름</strong>
				<small sec:authorize="hasRole('PROF')">교수</small>
				<small sec:authorize="hasRole('STUDENT')">학생</small>
			</span>
			<form th:action="@{/logout}" method="post">
				<button type="submit" class="btn btn-ghost btn-sm">로그아웃</button>
			</form>
		</div>
	</div>
</header>

<div th:fragment="alerts">
	<div class="alert alert-ok" th:if="${message}" th:text="${message}"></div>
	<div class="alert alert-err" th:if="${error}" th:text="${error}"></div>
</div>

<span th:fragment="status(value)" class="badge"
	  th:classappend="${value == '재학'} ? 'badge-green' : (${value == '휴학'} ? 'badge-amber' : (${value == '졸업'} ? 'badge-blue' : 'badge-gray'))"
	  th:text="${value}">재학</span>
</body>
</html>
