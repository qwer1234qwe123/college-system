<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('학생 관리')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
	<div class="page-head">
		<div>
			<h1>학생 관리</h1>
			<p class="muted">총 <strong th:text="${#lists.size(students)}">0</strong>명<span th:if="${keyword}"> · '<span th:text="${keyword}"></span>' 검색 결과</span></p>
		</div>
		<a class="btn btn-primary" th:href="@{/students/new}">+ 학생 등록</a>
	</div>
	<div th:replace="~{fragments/layout :: alerts}"></div>

	<div class="card">
		<form th:action="@{/students}" method="get" class="toolbar">
			<input type="search" name="keyword" th:value="${keyword}" placeholder="이름 또는 학번으로 검색">
			<button type="submit" class="btn">검색</button>
			<a class="btn btn-ghost" th:if="${keyword}" th:href="@{/students}">초기화</a>
		</form>

		<div class="table-wrap">
			<table class="table">
				<thead>
				<tr><th>학번</th><th>이름</th><th>학년</th><th>학적상태</th><th class="hide-sm">전화번호</th><th class="hide-sm">이메일</th></tr>
				</thead>
				<tbody>
				<tr th:each="s : ${students}" class="row-link"
					th:data-href="@{/students/{code}(code=${s.code})}">
					<td class="mono"><a th:href="@{/students/{code}(code=${s.code})}" th:text="${s.code}"></a></td>
					<td>
						<span class="name-cell">
							<span class="avatar sm" th:text="${#strings.substring(s.name, 0, 1)}"></span>
							<span th:text="${s.name}"></span>
						</span>
					</td>
					<td th:text="${s.grade} + '학년'"></td>
					<td><span th:replace="~{fragments/layout :: status(${s.status})}"></span></td>
					<td class="hide-sm" th:text="${s.phone}"></td>
					<td class="hide-sm" th:text="${s.email}"></td>
				</tr>
				<tr th:if="${#lists.isEmpty(students)}">
					<td colspan="6" class="empty">
						<span th:if="${keyword}">검색 결과가 없습니다.</span>
						<span th:unless="${keyword}">등록된 학생이 없습니다. 오른쪽 위 <strong>학생 등록</strong>으로 추가하세요.</span>
					</td>
				</tr>
				</tbody>
			</table>
		</div>
	</div>
</main>
<script>
	document.querySelectorAll('tr[data-href]').forEach(function (tr) {
		tr.addEventListener('click', function (e) {
			if (!e.target.closest('a')) location.href = tr.dataset.href;
		});
	});
</script>
</body>
</html>
