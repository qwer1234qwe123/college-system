<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('홈')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
	<div class="page-head">
		<div>
			<h1><span th:text="${currentUserName}">이름</span>님, 안녕하세요</h1>
			<p class="muted" th:text="${today} + ' · ' + ${termLabel}">오늘</p>
		</div>
	</div>

	<section class="stats" sec:authorize="hasRole('PROF')">
		<div class="stat">
			<span class="stat-label">전체 학생</span>
			<strong class="stat-value" th:text="${studentCount}">0</strong>
		</div>
		<div class="stat">
			<span class="stat-label">학과</span>
			<strong class="stat-value" th:text="${deptCount}">0</strong>
		</div>
		<div class="stat">
			<span class="stat-label">교수</span>
			<strong class="stat-value" th:text="${profCount}">0</strong>
		</div>
		<div class="stat">
			<span class="stat-label">이번 학기 개설 과목</span>
			<strong class="stat-value" th:text="${subjectCount}">0</strong>
		</div>
	</section>

	<section class="stats" sec:authorize="hasRole('STUDENT')">
		<div class="stat">
			<span class="stat-label">이번 학기 신청 과목</span>
			<strong class="stat-value" th:text="${mySubjectCount}">0</strong>
		</div>
		<div class="stat">
			<span class="stat-label">이번 학기 신청 학점</span>
			<strong class="stat-value" th:text="${myCredits}">0</strong>
		</div>
		<div class="stat">
			<span class="stat-label">전체 평점</span>
			<strong class="stat-value">
				<span th:text="${myGpa} == null ? '-' : ${#numbers.formatDecimal(myGpa, 1, 2)}">-</span><small> / 4.5</small>
			</strong>
		</div>
		<div class="stat">
			<span class="stat-label">취득 학점</span>
			<strong class="stat-value" th:text="${myEarned}">0</strong>
		</div>
	</section>

	<h2 class="section-title">바로가기</h2>
	<section class="tiles">
		<a class="tile" sec:authorize="hasRole('PROF')" th:href="@{/students}">
			<span class="tile-icon">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
			</span>
			<span class="tile-body">
				<strong>학생 관리</strong>
				<span>학생 등록 · 조회 · 수정 · 삭제</span>
			</span>
		</a>
		<a class="tile" sec:authorize="hasRole('PROF')" th:href="@{/departments}">
			<span class="tile-icon">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V9l7-5 7 5v12"/><path d="M9 21v-6h6v6"/></svg>
			</span>
			<span class="tile-body">
				<strong>학과 관리</strong>
				<span>학과 목록 · 추가</span>
			</span>
		</a>
		<a class="tile" sec:authorize="hasRole('PROF')" th:href="@{/subjects}">
			<span class="tile-icon">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
			</span>
			<span class="tile-body">
				<strong>과목 관리</strong>
				<span>과목 개설 · 강의시간 · 정원</span>
			</span>
		</a>
		<a class="tile" sec:authorize="hasRole('PROF')" th:href="@{/lectures}">
			<span class="tile-icon">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
			</span>
			<span class="tile-body">
				<strong>성적 입력</strong>
				<span>내 강의 수강생 성적 입력</span>
			</span>
		</a>
		<a class="tile" sec:authorize="hasRole('STUDENT')" th:href="@{/enroll}">
			<span class="tile-icon">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
			</span>
			<span class="tile-body">
				<strong>수강신청</strong>
				<span>과목 신청 · 취소 · 정원 확인</span>
			</span>
		</a>
		<a class="tile" sec:authorize="hasRole('STUDENT')" th:href="@{/my/grades}">
			<span class="tile-icon">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
			</span>
			<span class="tile-body">
				<strong>내 성적</strong>
				<span>학기별 성적 · 평점</span>
			</span>
		</a>
		<a class="tile" th:href="@{/timetable}">
			<span class="tile-icon">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
			</span>
			<span class="tile-body">
				<strong>시간표</strong>
				<span>주간 시간표 보기</span>
			</span>
		</a>
		<a class="tile" sec:authorize="hasRole('STUDENT')" th:href="@{/me}">
			<span class="tile-icon">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>
			</span>
			<span class="tile-body">
				<strong>내 정보</strong>
				<span>학적 정보 조회</span>
			</span>
		</a>
	</section>
</main>
</body>
</html>
