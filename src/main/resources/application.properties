spring.application.name=college-system

# 기본은 local 프로필 (배포 시 --spring.profiles.active=prod)
spring.profiles.default=local

# 테이블은 SQL 스크립트로 이미 만들었으므로 구조 검증만 한다
spring.jpa.hibernate.ddl-auto=validate
# 테이블/컬럼 이름을 대소문자 그대로 사용 (CS_Student_Info -> cs_student_info 변환 방지)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

spring.datasource.username=college
spring.datasource.password=${DB_PASSWORD}

# 첫 교수(관리자) 계정 자동 생성: 두 값이 모두 있을 때만, 계정이 없을 때 한 번 생성
app.init-prof.code=${INIT_PROF_CODE:}
app.init-prof.password=${INIT_PROF_PASSWORD:}
